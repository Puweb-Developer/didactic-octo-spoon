<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic Worlds</title>
<style>
    html, body{
        margin:0;padding:0;height:100%;background:#000;color:#fff;
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Arial,sans-serif;
        overflow:hidden;display:flex;justify-content:center;align-items:center;
    }
    #loading-screen{
        position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;
        background:#000;display:flex;justify-content:center;align-items:center;
        transition:opacity 1s ease-in-out;
    }
    #loading-text{opacity:0;transition:opacity 1s ease-in-out;}
    iframe{border:none;display:none;}
    .mobile-full{width:100%;height:100%;}
    .mobile-frame{
        width:390px;height:97vh;border-radius:10px;box-shadow:0 0 60px rgba(255,255,255,.2),0 0 120px rgba(255,255,255,.1);
        background:#fff;margin:auto;position:relative;z-index:1;
    }
    .mobile-frame::before{
        content:"";position:absolute;top:-10%;left:-10%;width:120%;height:120%;
        background:radial-gradient(circle,rgba(255,255,255,.15) 0%,rgba(255,255,255,0) 70%);
        border-radius:50%;filter:blur(40px);z-index:-1;
    }
</style>
</head>
<body>

<div id="loading-screen"><div id="loading-text">Please Wait…</div></div>
<iframe id="app-frame"></iframe>

<script>
/* ---------- Loading animation ---------- */
const messages = [
    "Connecting To Magic Worlds…",
    "Please wait…",
    "Connecting to Puweb server…",
    "You’re almost there…"
];
const loadingText = document.getElementById('loading-text');
let msgIndex = 0;
function showMessage(i){ loadingText.style.opacity=0; setTimeout(()=>{ loadingText.textContent=messages[i]; loadingText.style.opacity=1; },500); }
showMessage(msgIndex);
const msgInt = setInterval(()=>{ if(++msgIndex<messages.length) showMessage(msgIndex); },1500);

/* ---------- Device detection ---------- */
function isMobileDevice(){ return /android|iphone|ipad|ipod|opera mini|iemobile|wpdesktop/i.test(navigator.userAgent); }

const iframe = document.getElementById('app-frame');

/* ---------- Iframe setup ---------- */
if (isMobileDevice()) {
    iframe.src = "https://magicworldshub.github.io/magicworlds/";            // Link 1
    iframe.classList.add("mobile-full");

    // ---- FULL-SCREEN FIXES ----
    iframe.allowFullscreen = true;                     // modern attribute
    iframe.setAttribute("allow","fullscreen");         // legacy
    iframe.setAttribute("sandbox",
        "allow-same-origin allow-scripts allow-forms allow-modals allow-popups " +
        "allow-presentation allow-top-navigation-by-user-activation");

    // force the iframe to fill the viewport
    iframe.style.position = "fixed";
    iframe.style.top = iframe.style.left = "0";
    iframe.style.width = iframe.style.height = "100%";

    // optional: auto-enter fullscreen once the page inside is ready
    iframe.onload = () => {
        setTimeout(() => { if (iframe.requestFullscreen) iframe.requestFullscreen(); }, 300);
    };
}
else {
    iframe.src = "https://previewer.adalo.com/9a617ecf-1f98-45a1-a2c1-657fc4b4922e"; // Link 2
    iframe.classList.add("mobile-frame");
}

/* ---------- Show iframe after fake loading ---------- */
setTimeout(() => {
    document.getElementById('loading-screen').style.opacity = 0;
    setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        iframe.style.display = 'block';
    }, 1000);
    clearInterval(msgInt);
}, 4500);

/* ---------- PWA spoof / banner hide ---------- */
Object.defineProperty(window.navigator, 'standalone', {value:true, configurable:true});
setInterval(() => {
    const banner = document.querySelector('.add-to-home-screen-prompt, [data-testid="pwa-banner"]');
    if (banner) banner.style.display = 'none';
}, 1000);
</script>

</body>
</html>
